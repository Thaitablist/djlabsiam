/* พื้นสว่าง — เว็บ djlabsiam.com และแอปจองห้องใช้ scope นี้ (ข้อยกเว้นที่ประกาศไว้ใน D2B) */
[data-surface="light"] {
  --surface-page: var(--surface-inverse);
  --surface-card: var(--surface-card-inverse);
  --text-primary: #0F0F0F;
  --text-secondary: #333333;
  --text-muted: #666666;
  --text-brand: #BE2329;
  --border-hairline: #E8E8E8;
  --border-strong: #0F0F0F;
  --status-active: #0F6B3A;
  --status-active-text: #0F6B3A;
  --status-active-tint: #E6F2EA;
}

/* ชุดตัวอักษร — lineHeight ล็อกตายตัวทุกตัวตาม D3A เพราะข้อความไทยกินความสูงเกินที่ระบบคำนวณ */
.type-display {
  font-family: Prompt, sans-serif;
  font-size: clamp(40px, 7vw, 80px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 0;
}
.type-h1 {
  font-family: Prompt, sans-serif;
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: 0;
}
.type-h2 {
  font-family: Prompt, sans-serif;
  font-size: 30px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: 0;
}
.type-h3 {
  font-family: Prompt, sans-serif;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: 0;
}
.type-numeral {
  font-family: Prompt, sans-serif;
  font-size: clamp(30px, 3vw, 52px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -0.03em;
}
.type-body-large {
  font-family: 'Noto Sans Thai', Prompt, sans-serif;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.8;
  letter-spacing: 0;
}
.type-body {
  font-family: 'Noto Sans Thai', Prompt, sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: 0;
}
.type-body-small {
  font-family: 'Noto Sans Thai', Prompt, sans-serif;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: 0;
}
.type-label {
  font-family: Prompt, sans-serif;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.type-label-small {
  font-family: Prompt, sans-serif;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* กฎรูปทรง — มีสองทรงเท่านั้น เหลี่ยมมุมฉาก กับ วงกลมแท้ ห้ามมีค่ากลาง */
.shape-square { border-radius: var(--radius-none); }
.shape-circle { border-radius: var(--radius-full); }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-family-body)}
::selection{background:var(--brand-base);color:#fff}
/* ───────── product UI (ported from design-system/booking/mockups.html) ───────── */
.app{--pad:20px;--field-bg:var(--surface-sunken);--ink-soft:color-mix(in srgb,var(--text-primary) 45%,transparent);
  background:var(--surface-page);color:var(--text-primary);font-family:var(--font-family-body);font-size:16px;line-height:1.7;letter-spacing:0;position:relative}
.app[data-surface="light"]{--field-bg:#fff}
.app *{letter-spacing:0}
:where(.app) button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;border-radius:0;text-align:inherit}
:where(.app) a{color:inherit}
.app :focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
.app ::selection{background:var(--brand-base);color:#fff}
.app input,.app textarea,.app select{caret-color:var(--brand-base)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.head{background:#0F0F0F;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--pad);border-bottom:2px solid var(--brand-base)}
.head img{display:block;height:28px;width:auto}
.lang{display:flex;border:1px solid rgba(255,255,255,.45)}
.lang button{min-width:48px;min-height:44px;font:700 14px/1 Prompt;color:#fff;text-align:center}
.lang button[aria-pressed="true"]{background:#fff;color:#0F0F0F}

.steps{list-style:none;margin:0;padding:14px var(--pad) 0;display:flex;gap:var(--space-hairline)}
.steps li{flex:1;min-width:0;padding-right:6px;font:600 14px/1.3 Prompt;color:var(--text-muted);padding-top:8px;border-top:4px solid color-mix(in srgb,var(--text-primary) 16%,transparent)}
.steps li.on,.steps li.done{color:var(--text-primary);border-top-color:var(--text-primary)}
.steps li.on{font-weight:800}

.main{padding:18px var(--pad) 28px}
.main h1{font:900 26px/1.3 Prompt;margin:0 0 12px}
.main h2{font:800 20px/1.3 Prompt;margin:26px 0 12px}
.main h2 .n{display:inline-block;min-width:26px;color:var(--text-brand)}
.info{background:var(--surface-card);border:1px solid var(--border-hairline);padding:4px 14px}
.info div{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;line-height:1.6}
.info div+div{border-top:1px solid var(--border-hairline)}
.info b{font:700 14px/1.6 Prompt}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 14px;font-size:14px;line-height:1.6;box-shadow:inset 0 0 0 1px var(--text-primary)}

const qs=new URLSearchParams(location.search);
const pickLang=()=>{const q=qs.get('lang');if(q==='en'||q==='th')return q;const l=((navigator.languages&&navigator.languages[0])||navigator.language||'th').toLowerCase();return l.startsWith('th')?'th':'en'};
const normRef=v=>{v=(v||'').toLowerCase().trim();if(!v||v==='direct')return '';if(/^google[_-]?maps$/.test(v))v='maps';return v.slice(0,32)};
const S={lang:pickLang(),view:'loading',cfg:null,busy:{},stale:false,step:1,sel:null,start:null,hrs:1,setup:0,note:'',name:'',cmode:null,cc:'TH',phone:'',email:'',consent:false,

(()=>{const r=((navigator.languages&&navigator.languages[0])||navigator.language||'').split('-')[1];if(r&&DIAL.some(d=>d[0]===r.toUpperCase()))S.cc=S.lang==='en'?r.toUpperCase():'TH'})();

/* ═════════ helpers ═════════ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hh=h=>pad(h)+':00';
const ic=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const isoD=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parts=s=>s.split('-').map(Number);
const addDays=(s,n)=>{const [y,m,d]=parts(s),u=new Date(Date.UTC(y,m-1,d+n));return isoD(u.getUTCFullYear(),u.getUTCMonth()+1,u.getUTCDate())};
const dowOf=s=>{const [y,m,d]=parts(s);return new Date(Date.UTC(y,m-1,d)).getUTCDay()};
const dlabel=s=>{const [,m,d]=parts(s);return `${DOW[S.lang][dowOf(s)]} ${d} ${MON[S.lang][m-1]}`};
const normCode=v=>{let x=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(x.length===12&&x.startsWith('DJ'))x=x.slice(2);return /^[A-HJKMNP-Z2-9]{10}$/.test(x)?`DJ-${x.slice(0,5)}-${x.slice(5)}`:null};
const hourOf=s=>parseInt(s,10);
const openHours=()=>{const o=hourOf(S.cfg.open),c=hourOf(S.cfg.close);return Array.from({length:Math.max(c-o,0)},(_,i)=>o+i)};
const leadTxt=l=>{const m=S.cfg.min_lead_minutes;return l==='th'?(m%60===0?`${m/60} ชม.`:`${m} นาที`):(m%60===0?`${m/60} hour${m/60>1?'s':''}`:`${m} minutes`)};
/* the approved copy carries a few figures as words (opening hours, 4 h cap, 30 days, 1 h notice); the shop can change them in the console, so they are re-filled from the config */
const tx=s=>{if(!S.cfg||typeof s!=='string')return s;const c=S.cfg;
  return s.replace(/12:00–20:00/g,`${c.open}–${c.close}`).replace(/\b20:00\b/g,c.close)

   .replace(/อย่างน้อย 1 ชม\./g,`อย่างน้อย ${leadTxt('th')}`).replace(/อย่างน้อย 1 ชั่วโมง/g,`อย่างน้อย ${leadTxt('th').replace('ชม.','ชั่วโมง')}`).replace(/at least 1 hour/g,`at least ${leadTxt('en')}`)};

/* ═════════ backend (Supabase RPC, anon key, no SDK, nothing stored in the browser) ═════════ */
async function rpc(name,args){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
  try{const r=await fetch(API+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{}),signal:ctl.signal});
    if(!r.ok)throw new Error('http '+r.status);return await r.json()}
  finally{clearTimeout(to)}
}
async function loadConfig(){
  const c=await rpc('web_booking_config');
  if(!c||c.ok!==true||!Array.isArray(c.equipment_sets)||typeof c.price_per_hour!=='number'&&isNaN(Number(c.price_per_hour)))throw new Error('config');
  c.price_per_hour=Number(c.price_per_hour);S.cfg=c;return c;
}
async function loadBusy(){
  const c=S.cfg,r=await rpc('web_booking_busy',{p_from:c.today,p_to:addDays(c.today,c.max_days_ahead-1)});
  if(!r||r.ok!==true)throw Object.assign(new Error('busy'),{code:r&&r.error});
  const m={};(r.days||[]).forEach(d=>m[d.date]=d);S.busy=m;S.stale=!!r.stale;
}

/* ═════════ day / slot logic (values come from web_booking_busy, never computed here) ═════════ */
const dayList=()=>Array.from({length:S.cfg.max_days_ahead},(_,i)=>addDays(S.cfg.today,i));
function dayInfo(date){const b=S.busy[date],open=b?b.open_hours:openHours(),busy=b?b.busy_hours:[],early=b?b.too_early_hours:[];
  const free=open.filter(h=>!busy.includes(h)&&!early.includes(h));
  const full=open.length>0&&busy.length>=open.length,past=!full&&free.length===0&&open.every(h=>early.includes(h));
  return {open,busy,early,free,full,past,none:free.length===0}}
function slotState(h,n,di){if(di.early.includes(h))return 'soon';if(di.busy.includes(h))return 'full';
  for(let k=0;k<n;k++)if(!di.open.includes(h+k)||di.busy.includes(h+k))return 'short';return 'free'}
function maxHours(){if(S.start==null)return 1;const di=dayInfo(S.sel);let a=0;while(di.open.includes(S.start+a)&&!di.busy.includes(S.start+a))a++;return Math.max(1,Math.min(S.cfg.max_hours,a))}
function firstFreeDay(){return dayList().find(d=>!dayInfo(d).none)||dayList()[0]}
function fixSelection(){const days=dayList();if(!S.sel||!days.includes(S.sel))S.sel=firstFreeDay();
  const di=dayInfo(S.sel);if(S.start!=null&&slotState(S.start,1,di)!=='free')S.start=null;if(S.start!=null)S.hrs=Math.min(S.hrs,maxHours())}

const contactOptional=()=>!!(S.line.uid&&S.line.friend);
function phonePayload(){const raw=S.phone.trim();if(S.cc==='TH'){const d=raw.replace(/[^\d+]/g,'');return {ok:/^\+?66[1-9]\d{7,8}$/.test(d)||/^0[2-9]\d{7,8}$/.test(d),phone:raw,country:'TH'}}
  const dial=DIAL.find(x=>x[0]===S.cc)[1];let d=raw.replace(/[ ().\-]/g,'');
  if(!d.startsWith('+')){d=d.replace(/\D/g,'').replace(/^0+/,'');d='+'+dial+d}
  return {ok:/^\+[1-9]\d{6,14}$/.test(d),phone:d,country:S.cc}}
const emailOk=v=>v.length<=254&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
function validate(){const e={},t=T(),nm=S.name.trim();
  if(!nm||nm.length>80)e.name=t.e_name;

  if(val){if(useP?!phonePayload().ok:!emailOk(val))e.contact=useP?t.e_phone:t.e_email}
  else if(!contactOptional())e.contact=useP?t.e_phone:t.e_email;
  if(!S.consent)e.consent=t.e_consent;

function contactShown(){const useP=S.cmode==='phone',val=(useP?S.phone:S.email).trim();if(!val)return '';

  const stale=S.stale,collapsedDay=`<div class="info cl c-day" style="margin-top:12px;padding:0 14px"><div style="align-items:center;justify-content:space-between"><span><b>1</b> ${t.steps[0]}: ${dlabel(S.sel)}</span><button class="lnk" style="min-height:44px" data-act="goto" data-n="1">${t.edit}</button></div></div>`;
  const collapsedAll=`<div class="info cl c-all" style="margin-top:12px;padding:0 14px"><div style="align-items:center;justify-content:space-between"><span><b>1·2</b> ${t.steps[1]}: ${S.start!=null?`${dlabel(S.sel)} · ${hh(S.start)}–${hh(S.start+S.hrs)} · ${esc(eq[0])}`:''}</span><button class="lnk" style="min-height:44px" data-act="goto" data-n="2">${t.edit}</button></div></div>`;
  const gridBlock=stale?`<div class="alert err" role="alert">${ic('alert')}<span>${t.s_stale}</span></div>${contactBtns(t)}`:`${noticeHTML(t,'grid')}${timeGrid(t)}`;
  const todayShut=dayInfo(S.cfg.today).past;
  let todayMsg='';if(todayShut){const f=S.cfg.first_start||'',[fd,ft]=f.split('T');todayMsg=`<div class="alert" role="status">${ic('info')}<span>${t.s_todayFull}${fd?` · ${t.s_todayNext}: ${dlabel(fd)} ${esc((ft||'').slice(0,5))}`:''}</span></div>`}
  return `${head(t)}<div class="layout" data-step="${S.step}"><div class="col">
   <h1 id="h1" tabindex="-1">${t.title}</h1><p class="lede desk-only">${t.lede}</p>${info(t)}<div class="mob-only">${stepper(t)}</div>
   <section class="blk b-days"><h2><span class="n">1</span>${t.h1}</h2>${dayStrip(t)}${todayMsg}</section>${collapsedDay}
   <section class="blk b-grid"><h2><span class="n">2</span>${t.h2}</h2>${gridBlock}</section>
   <section class="blk b-hrs">${stale?'':hoursBlock(t)}<div style="height:22px"></div>${stale?'':setupBlock(t)}</section>${collapsedAll}
   <section class="blk b-det"><h2><span class="n">3</span>${t.h3}</h2>${detailsBlock(t)}</section>
   <section class="blk b-rev"><h1 style="font-size:24px">${t.h4}</h1>${reviewBlock(t,false)}</section>
   ${lookupBlock(t)}
  </div>
  <aside class="d-side desk-only">${photo}<div class="box"><h2 style="margin:0 0 12px;font-size:20px">${t.h4}</h2>${reviewBlock(t,true)}${findBlock(t).replace('class="find"','class="find" style="margin-top:14px"')}</div></aside></div>${bottomBar(t)}`}

function viewDone(){const t=T(),r=S.result,eq=equip()[S.setup]||['',''],mode=S.line.in&&S.line.uid?(S.line.friend?'line':'nofriend'):(S.cmode==='phone'&&contactShown()?'phone':(contactShown()?'email':'status'));
  const url=statusUrl(r.public_ref);
  const rLink=`<div>${ic('copy')}<div><b>${t.hLink}</b><div class="act"><button class="btn sec" data-act="copy" data-v="${esc(url)}">${ic('copy')}${t.copy}</button></div></div></div>`;
  const rMail=`<div>${ic('mail')}<div><b>${esc(t.hMail(S.email.trim()))}</b></div></div>`,rPhone=`<div>${ic('phone')}<div><b>${t.hPhoneOnly}</b></div></div>`;
  const rLine=BOT_LINK_READY&&!S.line.in?`<div>${ic('info')}<div><b>${t.hLine}</b><div class="act"><a class="btn sec" href="${SHOP.oa}${encodeURIComponent(r.public_ref)}" target="_blank" rel="noopener">${t.hLineBtn}</a></div></div></div>`:'';
  const rLineIn=`<div>${ic('check')}<div><b>LINE</b><p>${t.hLineIn}</p></div></div>`;
  const rNF=`<div>${ic('alert')}<div><b>${t.nfTitle}</b><p>${t.nfDone}</p><div class="act"><a class="btn sec" href="${SHOP.line}" target="_blank" rel="noopener">${t.nfAdd}</a></div></div></div>`;
  const how={email:rLink+rMail+rLine,phone:rLink+rPhone+rLine,status:rLink+rLine,line:rLineIn+(S.cmode&&contactShown()?(S.cmode==='phone'?rPhone:rMail):'')+rLink,nofriend:rNF+rLink+(contactShown()?(S.cmode==='phone'?rPhone:rMail):'')}[mode];
  const lineMsg=SHOP.oa+encodeURIComponent(t.lineChange(r.public_ref));
  return `${head(t)}<div class="layout wide"><div class="col"><div class="okmark">${ic('check')}</div><h1 id="h1" tabindex="-1">${t.done}</h1><span class="lbl" style="margin-top:6px">${t.codeL}</span><div class="code">${esc(r.public_ref)}</div><span class="pill">${t.wait}</span><p class="hint">${t.promise}</p>
   <dl class="sum" style="margin-top:16px"><div><dt>${t.r.date}</dt><dd>${dlabel(r.date)}</dd><span></span></div><div><dt>${t.r.time}</dt><dd>${r.start}–${r.end} · ${money(r.hours)}</dd><span></span></div><div><dt>${t.r.room}</dt><dd>${esc(eq[0])}</dd><span></span></div></dl>
   <h2>${t.howH}</h2><div class="rows">${how}<div>${ic('tag')}<div><b>${t.payH}</b><p>${t.pay}</p></div></div><div>${ic('info')}<div><b>${t.chgH}</b><p>${t.chg}</p><div class="act"><a class="btn sec" href="${lineMsg}" target="_blank" rel="noopener">${t.chgLine}</a><a class="btn sec" href="${SHOP.tel}">${ic('phone')}${t.call}</a></div></div></div></div>${findBlock(t)}
   <p style="margin:18px 0 0"><a class="lnk" href="${esc(url)}">${t.stLook}</a></p></div>
  <aside class="d-side desk-only">${photo}</aside></div>`}

function viewStatus(){const t=T(),st=S.status,ref=S.statusRef;
  const top=`${head(t)}<div class="layout wide"><div class="col">`,end=`</div><aside class="d-side desk-only">${photo}</aside></div>`;
  if(!st||st.loading)return `${top}<h1 id="h1" tabindex="-1">${t.stH}</h1><div class="slots" aria-busy="true" style="grid-template-columns:1fr 1fr"><div class="sk"></div><div class="sk"></div></div><p class="hint" role="status">${t.s_stLoad}</p>${end}`;
  if(st.err==='not_found')return `${top}<h1 id="h1" tabindex="-1">${t.nfH}</h1><div class="alert err" role="alert">${ic('alert')}<span>${t.nfB}</span></div>${contactBtns(t)}<p style="margin:10px 0 0"><a class="btn sec block" href="${bookUrl()}">${t.rebook}</a></p>${end}`;
  if(st.err)return `${top}<h1 id="h1" tabindex="-1">${t.stH}</h1><div class="alert err" role="alert">${ic('alert')}<span>${t.s_stFail}</span></div><p style="margin:12px 0 0"><button class="btn" data-act="retry-status">${t.retry}</button></p>${contactBtns(t)}${end}`;
  const k=st.status,eq=String(st.equipment||''),eqm=eq.match(/^(.*?)\s*\((.*)\)\s*$/),eqName=eqm?eqm[1]:eq;
  const pill=k==='cancelled'?`<span class="pill">${t.stCanc}</span>`:k==='pending'?`<span class="pill">${t.wait}</span>`:`<span class="pill ok">${ic('check')}${t.stSteps[1]}</span>`;
  const tl={pending:[[t.stSteps[0],1],[t.stSteps[1],0],[t.stSteps[2],0]],confirmed:[[t.stSteps[0],1],[t.stSteps[1],1,'ok'],[t.stSteps[2],0]],in_use:[[t.stSteps[0],1],[t.stSteps[1],1,'ok'],[t.stSteps[2],1,'ok']],done:[[t.stSteps[0],1],[t.stSteps[1],1,'ok'],[t.stSteps[2],1,'ok']],cancelled:[[t.stSteps[0],1],[t.stCanc,1]]}[k]||[[t.stSteps[0],1]];
  const lineMsg=SHOP.oa+encodeURIComponent(t.lineChange(ref));
  const extra={confirmed:`<div class="rows" style="margin-top:16px"><div>${ic('cal')}<div><b>${t.calH}</b><p>${t.calBody}</p><div class="act"><button class="btn sec" data-act="cal">${ic('cal')}${t.addCal}</button></div></div></div><div>${ic('info')}<div><b>${t.chgH}</b><p>${t.chg}</p><div class="act"><a class="btn sec" href="${lineMsg}" target="_blank" rel="noopener">${t.chgLine}</a><a class="btn sec" href="${SHOP.tel}">${ic('phone')}${t.call}</a></div></div></div></div>${findBlock(t)}`,
   pending:`<div class="rows" style="margin-top:16px"><div>${ic('info')}<div><b>${t.chgH}</b><p>${t.chg}</p><div class="act"><a class="btn sec" href="${lineMsg}" target="_blank" rel="noopener">${t.chgLine}</a><a class="btn sec" href="${SHOP.tel}">${ic('phone')}${t.call}</a></div></div></div></div><p class="hint">${t.promise}</p>${findBlock(t)}`,
   in_use:findBlock(t),done:findBlock(t),
   cancelled:`<div class="alert" style="margin-top:16px">${ic('info')}<span>${t.stCancBody}</span></div><p style="margin:14px 0 0"><a class="btn block" href="${bookUrl()}">${t.rebook}</a></p><p style="margin:10px 0 0"><a class="btn sec block" href="${SHOP.line}" target="_blank" rel="noopener">${t.contactLine}</a></p><p style="margin:10px 0 0"><a class="btn sec block" href="${SHOP.tel}">${ic('phone')}${t.call}</a></p>`}[k]||'';
  return `${top}<h1 id="h1" tabindex="-1">${t.stH}</h1><span class="lbl">${t.codeL}</span><div class="code">${esc(ref)}</div>${pill}
   <ol class="tl" style="margin-top:16px">${tl.map(x=>`<li class="${x[1]?'on':''}${x[2]?' ok':''}">${x[0]}</li>`).join('')}</ol>
   <dl class="sum" style="margin-top:16px"><div><dt>${t.r.date}</dt><dd>${dlabel(st.date)}</dd><span></span></div><div><dt>${t.r.time}</dt><dd>${esc(st.start)}–${esc(st.end)}</dd><span></span></div><div><dt>${t.r.room}</dt><dd>${esc(eqName)}</dd><span></span></div></dl>${extra}
   <p style="margin:18px 0 0"><button class="lnk" data-act="retry-status">${t.stLook}</button></p>${end}`}

function viewShut(kind){const t=T(),out=kind==='out';
  const m=out?[t.outH,t.outB,'alert']:[t.closedH,t.closedB,'info'];
  return `${head(t)}<div class="layout wide"><div class="col"><h1 id="h1" tabindex="-1">${m[0]}</h1><div class="alert${out?' err':''}" role="${out?'alert':'status'}">${ic(m[2])}<span>${m[1]}</span></div>${out?`<p style="margin:14px 0 0"><button class="btn block" data-act="reload">${t.retry}</button></p>`:''}<p style="margin:${out?10:14}px 0 0"><a class="btn${out?' sec':''} block" href="${SHOP.line}" target="_blank" rel="noopener">${t.contactLine}</a></p><p style="margin:10px 0 0"><a class="btn sec block" href="${SHOP.tel}">${ic('phone')}${t.call}</a></p>${S.cfg?findBlock(t):''}${kind==='closed'?lookupBlock(t):''}</div><aside class="d-side desk-only">${photo}</aside></div>`}

/* when the config is unavailable the page cannot use T() (no figures to fill in), so the shut views read the raw strings */
function viewLoading(){const t=T0[S.lang];return `${head(t)}<div class="layout wide"><div class="col"><h1 id="h1" tabindex="-1">${t.title}</h1><div class="slots" aria-busy="true" style="grid-template-columns:repeat(4,1fr)">${Array.from({length:8},()=>'<div class="sk"></div>').join('')}</div><p class="hint" role="status">${t.s_loadH}</p></div></div>`}

const bookUrl=()=>location.origin+'/book/'+(S.lang==='en'?'?lang=en':'');
const statusUrl=ref=>`${location.origin}/book/?s=${encodeURIComponent(ref)}&lang=${S.lang}`;

/* ═════════ render driver ═════════ */
const app=document.getElementById('app');
function render(focusH1){
  const keep=document.activeElement&&document.activeElement.id&&app.contains(document.activeElement)?{id:document.activeElement.id,s:document.activeElement.selectionStart,e:document.activeElement.selectionEnd}:null;
  let html;
  switch(S.view){case 'loading':html=viewLoading();break;case 'out':html=viewShut('out');break;case 'closed':html=viewShut('closed');break;case 'done':html=viewDone();break;case 'status':html=viewStatus();break;default:html=viewBook()}
  app.innerHTML=html;document.documentElement.lang=S.lang;document.title=T0[S.lang].pageTitle;
  if(S.view==='book'&&S.cfg){const h=app.querySelector('.layout');if(h)h.dataset.step=S.step}
  if(focusH1){const h=document.getElementById('h1');if(h){h.focus({preventScroll:true});window.scrollTo(0,0)}}
  else if(keep){const el=document.getElementById(keep.id);if(el){el.focus({preventScroll:true});try{if(keep.s!=null)el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

/* ═════════ actions ═════════ */
const contactErrors=(e)=>{S.errs=e;S.touched=true};
function go(step,push=true){S.step=step;if(push)history.pushState({step},'');render(true)}
function goFirstError(){render(false);const id=S.errs.name?'f-name':S.errs.contact?(S.cmode==='phone'?'f-phone':'f-email'):'f-consent';const el=document.getElementById(id);if(el){el.scrollIntoView({block:'center'});el.focus({preventScroll:true})}}
async function refreshBusy(){try{await loadBusy()}catch(e){}fixSelection()}
async function send(){
  if(S.sending)return;
  const e=validate();if(Object.keys(e).length){contactErrors(e);if(S.step!==3&&window.matchMedia('(max-width:959px)').matches){S.step=3;history.pushState({step:3},'');render(true)}else goFirstError();return}
  if(S.start==null)return;
  S.errs={};S.sending=true;S.notice=null;render();
  const c=contactFields(),payload=Object.assign({name:S.name.trim(),date:S.sel,start:hh(S.start),hours:S.hrs,equipment:S.cfg.equipment_sets[S.setup],lang:S.lang,note:S.note.trim()||undefined,consent:true,consent_version:CONSENT_VERSION,hp:(document.getElementById('hp')||{}).value||'',ref:S.ref||undefined,line_user_id:S.line.uid||undefined},c);
  let r=null,netFail=false;
  try{r=await rpc('web_booking_create',{p_data:payload})}catch(err){netFail=true}
  S.sending=false;
  if(netFail){S.notice={k:'net',where:'review'};S.uncertain=true;S.step=4;render();return}
  if(r&&r.ok){S.result=r;S.view='done';history.replaceState({view:'done'},'',`?s=${encodeURIComponent(r.public_ref)}&lang=${S.lang}`);render(true);return}
  const code=(r&&r.error)||'other';
  switch(code){
   case 'disabled':S.view='closed';render(true);return;
   case 'invalid_name':contactErrors({name:T().e_name});S.step=3;render(true);return;
   case 'invalid_phone':case 'invalid_email':case 'contact_required':contactErrors({contact:S.cmode==='phone'?T().e_phone:T().e_email});S.step=3;render(true);return;
   case 'consent_required':contactErrors({consent:T().e_consent});S.step=3;render(true);return;
   case 'slot_taken':{const h=S.start;await refreshBusy();S.start=null;S.notice=S.uncertain?{k:'maybe',where:'review'}:{k:'taken',h,where:'grid'};S.step=S.uncertain?4:2;render(true);return}
   case 'too_early':case 'too_far':{try{await loadConfig()}catch(e){}await refreshBusy();S.start=null;S.notice={k:'early',where:'grid'};S.step=2;render(true);return}
   case 'too_many_pending':S.notice={k:'rate',where:'review'};S.step=4;render(true);return;
   case 'busy_try_later':case 'contact_shop':S.notice={k:'later',where:'review'};S.step=4;render(true);return;
   default:S.notice={k:'other',where:'review'};S.step=4;render(true)}
}
async function boot(){
  S.view='loading';render();
  try{await loadConfig();await initLine()}catch(e){S.view='out';render(true);return}
  const sref=qs.get('s');
  if(sref){S.statusRef=normCode(sref)||sref.slice(0,40);S.view='status';S.status={loading:true};render(true);return statusLoad()}
  if(!S.cfg.enabled){S.view='closed';S.home='closed';history.replaceState({home:'closed'},'');render(true);return}
  try{await loadBusy()}catch(e){if(e&&e.code==='disabled'){S.view='closed';S.home='closed';history.replaceState({home:'closed'},'');render(true);return}S.view='out';render(true);return}
  fixSelection();S.view='book';S.home='book';S.step=1;history.replaceState({step:1},'');render(false);
}
function doLookup(){const el=document.getElementById('f-lookup');S.lookup=el?el.value:S.lookup;const c=normCode(S.lookup);
  if(!c){S.lookupErr=true;render();const i=document.getElementById('f-lookup');if(i)i.focus();return}
  S.lookupErr=false;S.statusRef=c;S.view='status';S.status={loading:true};
  history.pushState({view:'status'},'',`?s=${encodeURIComponent(c)}&lang=${S.lang}`);render(true);statusLoad()}
async function statusLoad(){
  const code=normCode(S.statusRef);if(!code){S.status={err:'not_found'};render(true);return}
  S.statusRef=code;S.status={loading:true};render();
  try{const r=await rpc('web_booking_status',{p_ref:code});S.status=r&&r.ok?r:{err:(r&&r.error)||'other'}}catch(e){S.status={err:'net'}}
  render(true)}
function icsDownload(){const st=S.status;if(!st||!st.date)return;const [y,m,d]=parts(st.date),sh=hourOf(st.start),eh=hourOf(st.end);
  const f=(h)=>{const u=new Date(Date.UTC(y,m-1,d,h-7,0,0));return u.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DJ LAB SIAM//book//EN','BEGIN:VEVENT',`UID:${S.statusRef}@djlabsiam.com`,`DTSTAMP:${f(sh).slice(0,15)}Z`,`DTSTART:${f(sh)}`,`DTEND:${f(eh)}`,`SUMMARY:${S.lang==='th'?'ห้องซ้อม DJ LAB SIAM':'DJ LAB SIAM practice room'}`,`LOCATION:${SHOP.addr}`,`DESCRIPTION:${S.statusRef}`,'END:VEVENT','END:VCALENDAR'];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));a.download='djlabsiam-practice-room.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function copyText(v,btn){try{await navigator.clipboard.writeText(v)}catch(e){const i=document.createElement('input');i.value=v;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(_){}i.remove()}
  if(btn){const t=T(),old=btn.innerHTML;btn.innerHTML=ic('check')+t.copied;setTimeout(()=>{if(btn.isConnected)btn.innerHTML=old},1800)}}

app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const a=b.dataset.act;
  switch(a){
   case 'lang':if(b.dataset.v!==S.lang){const wasDefault=S.cmode===(S.lang==='en'?'email':'phone')&&!S.phone&&!S.email;S.lang=b.dataset.v;if(wasDefault)S.cmode=S.lang==='en'?'email':'phone';S.errs=S.touched?validate():{};render()}break;
   case 'day':{S.sel=b.dataset.d;S.notice=null;fixSelection();render();break}
   case 'start':S.start=+b.dataset.h;S.hrs=Math.min(S.hrs,maxHours());S.notice=null;render();break;
   case 'hrs':S.hrs=+b.dataset.n;render();break;
   case 'cmode':S.cmode=b.dataset.v;if(S.touched)S.errs=validate();render();break;
   case 'next':if(S.start==null)break;if(S.step===3){const e=validate();if(Object.keys(e).length){contactErrors(e);goFirstError();break}S.errs={};}go(Math.min(4,S.step+1));break;
   case 'back':history.back();break;
   case 'goto':go(+b.dataset.n);break;
   case 'send':send();break;
   case 'reload':boot();break;
   case 'retry-status':statusLoad();break;
   case 'copy':copyText(b.dataset.v,b);break;
   case 'cal':icsDownload();break;
   case 'lookup':doLookup();break;
  }});
app.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='f-lookup'){ev.preventDefault();doLookup()}});
app.addEventListener('input',ev=>{const i=ev.target;let changed=false;
  if(i.id==='f-lookup'){S.lookup=i.value;if(S.lookupErr){S.lookupErr=false;render()}}
  if(i.id==='f-name'){S.name=i.value;changed=true}else if(i.id==='f-phone'){S.phone=i.value;changed=true}else if(i.id==='f-email'){S.email=i.value;changed=true}else if(i.id==='f-note'){S.note=i.value}
  if(changed&&S.touched){S.errs=validate();render()}});
app.addEventListener('change',ev=>{const i=ev.target;
  if(i.id==='f-consent'){S.consent=i.checked;if(S.touched){S.errs=validate();render()}}
  else if(i.id==='f-cc'){S.cc=i.value;if(S.touched){S.errs=validate();render()}}
  else if(i.name==='setup'){S.setup=+i.value}});
window.addEventListener('popstate',ev=>{const st=ev.state;
  if(S.view==='status'&&S.home&&!(st&&st.view==='status')){S.view=S.home;if(st&&st.step)S.step=st.step;render(true);return}
  if(S.view==='book'&&st&&st.step){S.step=st.step;render(true)}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.line.in&&!S.line.friend&&window.liff){await checkFriend();if(S.view==='book'||S.view==='done')render()}});

boot().catch(()=>{S.view='out';render(true)});
})();
</script>
</body>
</html>
